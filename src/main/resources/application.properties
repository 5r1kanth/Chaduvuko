# Application name
spring.application.name=chaduvuko-backend

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/online_learning_platform?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=demo
spring.datasource.password=demos123

# Hibernate Configuration
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=true

# Hibernate DDL Configuration (Prevent schema recreation on every startup)
spring.jpa.hibernate.ddl-auto=update

# Show SQL in the console
spring.jpa.show-sql=true

# Initialize the database with data.sql on the first startup only
spring.datasource.initialization-mode=always

# Load data from data.sql file from custom location
spring.datasource.data=classpath:sql/data.sql


